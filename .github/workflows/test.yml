name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  checks: write # required by dorny/test-reporter
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Start demo shop app
        run: |
          chmod +x ./binaries/shopping-store-linux-amd64
          ./binaries/shopping-store-linux-amd64 > server.log 2>&1 &

      - name: Wait for app on port 2221
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:2221 > /dev/null && exit 0
            sleep 2
          done
          cat server.log
          exit 1

      - name: Run tests
        run: npx playwright test
        continue-on-error: true # let the reporter step always run

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Playwright Tests
          path: test-results/results.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure screenshots and videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/**/*.png
            test-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload app log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-log
          path: server.log
          retention-days: 14
