name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss)
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Start demo shop app
        run: |
          chmod +x ./binaries/shopping-store-linux-amd64
          ./binaries/shopping-store-linux-amd64 > server.log 2>&1 &

      - name: Wait for app on port 2221
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:2221 > /dev/null && exit 0
            sleep 2
          done
          cat server.log
          exit 1

      - name: Run tests
        run: npx playwright test
        continue-on-error: true # the report stage decides pass or fail

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload app log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-log
          path: server.log
          retention-days: 14

  report:
    name: Publish Results
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Publish test results
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Tests
          path: test-results/results.xml
          reporter: java-junit
          fail-on-error: true

  notify:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [test, report]
    if: always()
    steps:
      - name: Summary
        env:
          TEST_RESULT: ${{ needs.test.result }}
          REPORT_RESULT: ${{ needs.report.result }}
        run: |
          echo "## Pipeline Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Test stage: $TEST_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Report stage: $REPORT_RESULT" >> "$GITHUB_STEP_SUMMARY"
